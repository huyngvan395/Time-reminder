name: chronoglass
description: "ChronoGlass — Modern Glassmorphism Time Reminder & Alarm App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  sqflite: ^2.4.1
  path: ^1.9.1
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  android_alarm_manager_plus: ^4.0.6
  wakelock_plus: ^1.2.10
  audioplayers: ^6.1.0
  vibration: ^3.1.2
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/sounds/
