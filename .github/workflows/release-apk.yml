name: Build & Release ChronoGlass APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & Run Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifact
        id: meta
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK_NAME="ChronoGlass-${TAG}-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ChronoGlass ${{ steps.meta.outputs.tag }}"
          body: |
            ## ChronoGlass Automated Release (${{ steps.meta.outputs.tag }})
            - Commit: `${{ github.sha }}`
            - Built automatically via GitHub Actions (`flutter build apk --release`)
            - Download `${{ steps.meta.outputs.apk_name }}` below to install on Android (API 23+).
          files: |
            ${{ steps.meta.outputs.apk_name }}
          generate_release_notes: true
